name: LintLang

on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/lintlang.yml
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/lintlang.yml

permissions:
  contents: read
  security-events: write

jobs:
  agent-instructions:
    uses: hermes-labs-ai/.github/.github/workflows/reusable-lintlang.yml@main
    with:
      path: AGENTS.md
