name: Release to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          hermeneutic --help
      - name: Test the exact source distribution
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/hermeneutic-*.tar.gz -C "$tmp"
          cd "$tmp"/hermeneutic-*
          python -m pip install -e ".[dev]"
          python -m pytest -ra
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing — no stored secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
