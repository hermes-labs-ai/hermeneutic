name: Release to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          tar -tzf dist/hermeneutic-*.tar.gz | grep -Fq 'scripts/smoke-installed-cli.sh'
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          bash scripts/smoke-installed-cli.sh
          python scripts/check-correction-demo.py
          python scripts/check-product-baseline.py
          python scripts/check-lesson-demo.py
          python scripts/check-release.py
      - name: Test the exact source distribution
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/hermeneutic-*.tar.gz -C "$tmp"
          cd "$tmp"/hermeneutic-*
          python -m pip install -e ".[dev]"
          python -m pytest -ra
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # OIDC trusted publishing — no stored secrets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
